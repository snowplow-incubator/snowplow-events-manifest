name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - uses: actions/checkout@v2
      - uses: coursier/cache-action@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Run tests
        run: sbt +test

      - name: Check assets can be published
        run: sbt +publishLocal
